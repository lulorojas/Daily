<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0B0E14">
<title>Daily</title>

<!-- PWA / iOS standalone -->
<link rel="manifest" href="./manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Daily">
<link rel="apple-touch-icon" href="./icons/icon-180.png">
<link rel="icon" type="image/png" href="./icons/icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="./css/styles.css">
</head>
<body>
<div id="app"></div>
<div class="overlay" id="overlay"></div>

<!-- Firebase en versión "compat": expone el global `firebase`, sin módulos ES, igual que
     el resto del proyecto. Los .js viven en el repo (no en el CDN) para que el service
     worker los cachee como cualquier archivo propio y la app siga abriendo sin internet. -->
<script src="./js/vendor/firebase-app-compat.js"></script>
<script src="./js/vendor/firebase-auth-compat.js"></script>
<script src="./js/vendor/firebase-firestore-compat.js"></script>
<script src="./js/firebase-config.js"></script>

<!-- Módulos cargados como scripts clásicos en orden de dependencia:
     utils (constantes, estado, helpers, modales) → secciones → auth → app (nav + init) -->
<script src="./js/utils.js"></script>
<script src="./js/hoy.js"></script>
<script src="./js/agenda.js"></script>
<script src="./js/calendario.js"></script>
<script src="./js/gimnasio.js"></script>
<script src="./js/rutinas.js"></script>
<script src="./js/habitos.js"></script>
<script src="./js/progreso.js"></script>
<script src="./js/ajustes.js"></script>
<script src="./js/firestore.js"></script>
<script src="./js/auth.js"></script>
<script src="./js/app.js"></script>
</body>
</html>
