<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0B0E14">
<title>Daily</title>

<!-- PWA / iOS standalone: vite-plugin-pwa inyecta solo el <link rel="manifest">, a
     partir del `manifest` de vite.config.js. Lo que sigue Safari NO lo lee del manifest
     (iOS todavía no respeta display/icons del web manifest para "Agregar a inicio"), así
     que se repite acá a mano, igual que en app/index.html. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Daily">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<link rel="icon" type="image/png" href="/icons/icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
<!-- Único nodo que React controla. Todo lo demás (incluido el CSS) lo importa main.jsx,
     así Vite lo procesa y le pone hash en el build. -->
<div id="root"></div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
